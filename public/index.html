<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Home Screen app: no system bar at the top (no blurred strip) - the page runs up under the clock and keeps its own
     content clear of it (style.css: env(safe-area-inset-top)). iOS reads this when the icon is added. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>COTEXT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The page: a heading (☰, ‹ passage ›, ⋯ and the helps' menu under it), the chapter's interlinear, the word's
     panel, the passage picker, the study drawer and its screens. -->
<main>
  <header class="head">
    <div class="row">
      <button class="pill icon" id="drawerBtn" aria-label="Study tools">☰</button>
      <span class="nav">
        <button class="pill" id="prev" aria-label="Previous chapter">‹</button>
        <button class="pill place" id="place">COTEXT</button>
        <button class="pill" id="next" aria-label="Next chapter">›</button>
      </span>
      <button class="pill icon" id="optionsBtn" aria-expanded="false" aria-controls="options" aria-label="Helps">⋯</button>
    </div>
    <div class="bar" id="options" hidden>
      <button class="pill" id="showAll" aria-pressed="false">Show helps</button>
      <button class="pill" id="mine" aria-pressed="true">My selections</button>
      <button class="pill" id="scope" aria-pressed="false">Frequency: whole OT</button>
      <label class="freq" for="freq"><span id="freqOut"></span><input id="freq" type="range" min="0" max="100" value="0"></label>
    </div>
  </header>
  <p id="status">Loading the text…</p>
  <div id="chapter"></div>
  <p class="credit">Text, parsing and lexicons: STEPBible Data, Tyndale House, Cambridge (CC BY 4.0).</p>
</main>
<div id="sheet" hidden>
  <div class="top"><span class="lemma" id="lemma"></span><span class="acts"><button class="pill" id="knowIt">I know this word</button><button class="pill" id="close">Close</button></span></div>
  <div class="full" id="full"></div>
  <div class="src" id="src"></div>
  <div class="def" id="def"></div>
</div>
<div id="picker" hidden>
  <div class="pickerCard">
    <div class="top"><h1 id="pickerTitle">Books</h1><button class="pill" id="pickerClose">Done</button></div>
    <div id="pickerBody"></div>
  </div>
</div>
<div id="drawer" hidden>
  <nav id="drawerPanel">
    <div class="top"><b>Study</b><button class="pill" id="drawerClose" aria-label="Close">✕</button></div>
    <button class="pill" id="homeBtn">HEBREW OT</button>
    <button class="pill" id="myVocab" data-screen="My vocab">My vocab</button>
    <button class="pill" id="paradigms" data-screen="Verb paradigms">Verb paradigms</button>
    <button class="pill" id="chartBtn" data-screen="Verb chart">Verb chart</button>
    <button class="pill" id="guideBtn" data-screen="Parsing guide">Parsing guide</button>
  </nav>
</div>
<div id="screen" hidden>
  <button class="pill icon" id="screenMenu" aria-label="Study tools">☰</button>
  <div class="pickerCard"><h1 id="screenTitle"></h1><p>Coming soon.</p></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
