<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>COTEXT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The page: a heading (‹ passage ›), the chapter's interlinear, the word's panel and the passage picker. -->
<main>
  <header class="head">
    <button class="pill" id="prev" aria-label="Previous chapter">‹</button>
    <button class="pill place" id="place">COTEXT</button>
    <button class="pill" id="next" aria-label="Next chapter">›</button>
  </header>
  <p id="status">Loading the text…</p>
  <div id="chapter"></div>
  <p class="credit">Text, parsing and lexicons: STEPBible Data, Tyndale House, Cambridge (CC BY 4.0).</p>
</main>
<div id="sheet" hidden>
  <div class="top"><span class="lemma" id="lemma"></span><button class="pill" id="close">Close</button></div>
  <div class="full" id="full"></div>
  <div class="src" id="src"></div>
  <div class="def" id="def"></div>
</div>
<div id="picker" hidden>
  <div class="pickerCard">
    <div class="top"><h1 id="pickerTitle">Books</h1><button class="pill" id="pickerClose">Done</button></div>
    <div id="pickerBody"></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
